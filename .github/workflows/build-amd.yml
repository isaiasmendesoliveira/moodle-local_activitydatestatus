name: Rebuild Moodle AMD

on:
  workflow_dispatch:
  push:
    paths:
      - 'amd/src/**'
      - '.github/workflows/build-amd.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, mysqli, zip, gd, soap, intl
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle 5.2 development environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_502_STABLE

      - name: Rebuild AMD assets with Moodle Grunt
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/moodle/public/local/activitydatestatus/amd" ]; then
            AMD_DIR="$GITHUB_WORKSPACE/moodle/public/local/activitydatestatus/amd"
          else
            AMD_DIR="$GITHUB_WORKSPACE/moodle/local/activitydatestatus/amd"
          fi
          cd "$AMD_DIR"
          npx grunt amd
          cp "$AMD_DIR/build/course.min.js" "$GITHUB_WORKSPACE/plugin/amd/build/course.min.js"
          cp "$AMD_DIR/build/course.min.js.map" "$GITHUB_WORKSPACE/plugin/amd/build/course.min.js.map"

      - name: Commit generated AMD files
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail
          git add amd/build/course.min.js amd/build/course.min.js.map
          if git diff --cached --quiet; then
            echo "AMD assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Moodle AMD assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
